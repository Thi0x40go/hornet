[package]
name = "hornet"
version = "0.1.0"
edition = "2021"
description = "Fast, keyboard-driven Terminal Database Client built with Rust & Ratatui"
license = "MIT"
authors = ["Thiago Pinheiro"]
readme = "README.md"
keywords = ["sql", "database", "tui", "ratatui", "vim"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "hornet"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
base64 = "0.22"
chrono = "0.4"
